<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Doglan Günüň Gutly Bolsun, Ogulmaral!</title>
    
    <!-- Three.js we zerur kitaphanalar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --neon-purple: #b800e6;
            --neon-red: #ff0055;
            --dark-bg: #050005;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        /* Ekranlaryň umumy stili */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 10;
            background: radial-gradient(circle at center, #1a001a 0%, #000 100%);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Başla Ekrany */
        #start-screen h1 {
            font-size: 2.5rem;
            color: var(--neon-purple);
            text-shadow: 0 0 10px var(--neon-purple), 0 0 25px var(--neon-red);
            margin-bottom: 20px;
            padding: 20px;
        }

        .start-btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            background: transparent;
            color: #fff;
            border: 2px solid var(--neon-red);
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-red) inset, 0 0 15px var(--neon-red);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            background: var(--neon-red);
            box-shadow: 0 0 30px var(--neon-red) inset, 0 0 40px var(--neon-red);
            transform: scale(1.05);
        }

        /* Taýmer */
        #countdown-screen h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-purple);
        }

        #timer {
            font-size: 8rem;
            font-weight: bold;
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red), 0 0 50px var(--neon-purple);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 3D Ekran */
        #celebration-screen {
            background: transparent;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* YouTube Container (Gizlin) */
        #youtube-audio {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        .hint {
            position: absolute;
            bottom: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            z-index: 20;
            animation: fadeInOut 3s infinite;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- YouTube Audio Player -->
    <div id="youtube-audio"></div>

    <!-- Başla Ekrany (Sene barlagy aýryldy, gönümel shu ekran açylýar) -->
    <div id="start-screen" class="screen active">
        <h1>Taýýarmyň, Ogulmaral?</h1>
        <button class="start-btn" onclick="startSequence()">Başla</button>
    </div>

    <!-- Taýmer Ekrany -->
    <div id="countdown-screen" class="screen">
        <h2>Garaşyň...</h2>
        <div id="timer">10</div>
    </div>

    <!-- 3D Gutlag Ekrany -->
    <div id="celebration-screen" class="screen">
        <div id="canvas-container"></div>
        <div class="hint">Ekrany aýlap we basyp görüň (Drag & Click)</div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- 1. YOUTUBE SAZ SAZLAMALARY ---
        let ytPlayer;
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-audio', {
                videoId: 'CM6qCGP9t6k',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0,
                    'playsinline': 1
                }
            });
        }

        // --- 2. ANIMASIÝA WE TAÝMER LOGIKASY ---
        function startSequence() {
            // Sazy taýýarlap we sessiz ýagdaýda başlatmak (Browser autoplay düzgünleri üçin)
            if(ytPlayer && ytPlayer.playVideo) {
                ytPlayer.setVolume(100);
                ytPlayer.playVideo();
            }

            document.getElementById('start-screen').classList.remove('active');
            const countdownScreen = document.getElementById('countdown-screen');
            countdownScreen.classList.add('active');

            let timeLeft = 10;
            const timerEl = document.getElementById('timer');
            
            const interval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    countdownScreen.classList.remove('active');
                    startCelebration();
                }
            }, 1000);
        }

        function startCelebration() {
            document.getElementById('celebration-screen').classList.add('active');
            
            // Başlangyç Confetti partlamasy
            fireMassiveConfetti();

            // 3D Sahnany başlatmak
            initThreeJS();
        }

        // Confetti funksiýasy (Click we Başlangyç üçin)
        function fireMassiveConfetti() {
            const duration = 5000;
            const animationEnd = Date.now() + duration;

            (function frame() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return;
                confetti({
                    particleCount: 5,
                    angle: Math.random() * 360,
                    spread: 70,
                    origin: { x: Math.random(), y: Math.random() - 0.2 },
                    colors: ['#b800e6', '#ff0055', '#ffffff']
                });
                requestAnimationFrame(frame);
            }());
        }

        // Ekrana basylanda bolýan effekt
        window.addEventListener('pointerdown', (e) => {
            if(document.getElementById('celebration-screen').classList.contains('active')) {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                confetti({
                    particleCount: 30,
                    spread: 50,
                    origin: { x: x, y: y },
                    colors: ['#b800e6', '#ff0055', '#ffffff'],
                    shapes: ['circle', 'star']
                });
            }
        });

        // --- 3. THREE.JS 3D SAHNA ---
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 18);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // OrbitControls (Interaktiwlik - Aýlamak üçin)
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;
            controls.enablePan = false;
            controls.minDistance = 5;
            controls.maxDistance = 30;

            // Çyralar
            scene.add(new THREE.AmbientLight(0x333333));
            
            const pointLight1 = new THREE.PointLight(0xff0055, 2, 50);
            pointLight1.position.set(5, 5, 5);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xb800e6, 2, 50);
            pointLight2.position.set(-5, -5, -5);
            scene.add(pointLight2);

            // 1. Esasy Merkezi Tor (Torus Grid)
            const torusGeo = new THREE.TorusGeometry(4, 1.5, 16, 100);
            const torusMat = new THREE.MeshStandardMaterial({ 
                color: 0x110022, 
                emissive: 0xb800e6,
                emissiveIntensity: 0.4,
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });
            const torus = new THREE.Mesh(torusGeo, torusMat);
            scene.add(torus);

            // 2. 2D Texti 3D Texture öwürmek funksiýasy (Turkmen harplaryny goramak üçin)
            function createTextMesh(message, color, size, isCenter=false) {
                const canvas = document.createElement('canvas');
                canvas.width = isCenter ? 512 : 1024;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = 'rgba(0,0,0,0)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.font = `bold ${size}px "Segoe UI", Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ffffff';
                
                ctx.fillText(message, canvas.width / 2, canvas.height / 2);
                
                const texture = new THREE.CanvasTexture(canvas);
                const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                const geo = new THREE.PlaneGeometry(isCenter ? 6 : 12, isCenter ? 3 : 3);
                return new THREE.Mesh(geo, mat);
            }

            // Merkezi "16"
            const center16 = createTextMesh("16 ÝAŞ", "#ff0055", 100, true);
            scene.add(center16);

            // 3. Daşyndaky Gutlag Sözleri (Orbiting Text)
            const sentences = [
                "Mähriban Ogulmaral!",
                "Bu gün durmuşyňdaky iň ajaýyp günleriň biri",
                "16 ýaşyň dolýan güni! Tüýs ýürekden gutlaýarys!",
                "Parlap duran ýyldyzlar ýaly, gelejegiň ýagty,",
                "arzuwlaryň beýik we ýoluň açyk bolsun.",
                "Durmuşyň şatlykdan, bagtdan doly bolsun!",
                "Doglan günüň gutly bolsun, Ogulmaral!"
            ];

            const textGroup = new THREE.Group();
            const radius = 8;
            
            sentences.forEach((text, i) => {
                const mesh = createTextMesh(text, "#b800e6", 45);
                const angle = (i / sentences.length) * Math.PI * 2;
                
                mesh.position.set(
                    Math.cos(angle) * radius,
                    (Math.random() - 0.5) * 2, // Azajyk ýokary-aşak üýtgeşiklik
                    Math.sin(angle) * radius
                );
                
                // Tekstleriň daşary seretmegi üçin
                mesh.lookAt(0, mesh.position.y, 0);
                mesh.rotateY(Math.PI); 
                
                textGroup.add(mesh);
            });
            scene.add(textGroup);

            // 4. Arka Fondaky 3D Ýürekler
            const hearts = [];
            const heartShape = new THREE.Shape();
            const x = 0, y = 0;
            heartShape.moveTo( x + 2.5, y + 2.5 );
            heartShape.bezierCurveTo( x + 2.5, y + 2.5, x + 2, y, x, y );
            heartShape.bezierCurveTo( x - 3, y, x - 3, y + 3.5, x - 3, y + 3.5 );
            heartShape.bezierCurveTo( x - 3, y + 5.5, x - 1.5, y + 7.7, x + 2.5, y + 9.5 );
            heartShape.bezierCurveTo( x + 6, y + 7.7, x + 8, y + 5.5, x + 8, y + 3.5 );
            heartShape.bezierCurveTo( x + 8, y + 3.5, x + 8, y, x + 5, y );
            heartShape.bezierCurveTo( x + 3.5, y, x + 2.5, y + 2.5, x + 2.5, y + 2.5 );

            const extrudeSettings = { depth: 0.5, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.2, bevelThickness: 0.2 };
            const heartGeo = new THREE.ExtrudeGeometry( heartShape, extrudeSettings );
            heartGeo.center();

            const heartMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x440011 });

            for(let i=0; i<30; i++) {
                const heart = new THREE.Mesh(heartGeo, heartMat);
                heart.position.set(
                    (Math.random() - 0.5) * 40,
                    (Math.random() - 0.5) * 40,
                    (Math.random() - 0.5) * 40 - 10
                );
                heart.scale.set(0.15, 0.15, 0.15);
                heart.rotation.z = Math.PI;
                scene.add(heart);
                hearts.push({
                    mesh: heart,
                    ry: (Math.random() - 0.5) * 0.02,
                    dy: Math.random() * 0.05 + 0.02
                });
            }

            // 5. Ýyldyzlar / Zerreler (Particles)
            const starsGeo = new THREE.BufferGeometry();
            const starsCount = 500;
            const posArray = new Float32Array(starsCount * 3);
            for(let i = 0; i < starsCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 60;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starsMat = new THREE.PointsMaterial({ size: 0.15, color: 0xffffff, transparent: true, opacity: 0.8 });
            const starMesh = new THREE.Points(starsGeo, starsMat);
            scene.add(starMesh);

            // Ekran ölçegleri
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Animasiýa Halka (Render Loop)
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const time = clock.getElapsedTime();

                // Torus hereketi
                torus.rotation.x += 0.005;
                torus.rotation.y += 0.01;
                
                // Merkezi tekstiň pulsiýasy
                center16.position.y = Math.sin(time * 2) * 0.5;
                center16.lookAt(camera.position);

                // Tekst toparynyň ýuwaş aýlanmagy
                textGroup.rotation.y += 0.002;

                // Ýürekleriň uçmagy
                hearts.forEach(h => {
                    h.mesh.rotation.y += h.ry;
                    h.mesh.position.y += h.dy;
                    if(h.mesh.position.y > 20) h.mesh.position.y = -20;
                });

                // Ýyldyzlaryň aýlanmagy
                starMesh.rotation.y = time * 0.02;

                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
